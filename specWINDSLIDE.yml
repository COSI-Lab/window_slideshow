apiVersion: apps/v1
kind: Deployment
metadata:
  name: window-slideshow #WEEEEE!!!
  namespace: cosi
  labels:
    app: window-slideshow #DO NOT JST PUT "C"!!!
spec:
  replicas: 1
  selector:
    matchLabels:
      app: window-slideshow
  template:
    metadata:
      labels:
        app: window-slideshow
    spec:
      containers:
        - name: window-slideshow
          image: registry.cosi.clarkson.edu/cosi-meta/window-slideshow
          ports:
            - containerPort: 8080
          #CONECT TO THE POD HERE PT 1
          volumeMounts:
            - name: data
              mountPath: /home/window-slideshow/window-slideshow/data
          #^^^
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      #CONECT TO THE POD HERE PT 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: window-slideshow-data # use name from PersistentVolumeClaim
      #^^^
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: window-slideshow-data #Kabab case, USE FOR PART 2!
    namespace: cosi
spec:
    accessModes:
    - ReadWriteMany #INFANET EDITS
    storageClassName: longhorn #burg
    resources:
        requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: window-slideshow
  namespace: cosi
spec:
  selector: {app: window-slideshow}
  ports:
    - port: 80
      targetPort: 8080 #The port you are using for the containerPort.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: window-slideshow-tls
  namespace: cosi
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`window-slideshow.cosi.clarkson.edu`)
      services:
        - name: window-slideshow
          port: 80
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: window-slideshow-redirect
  namespace: cosi
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`window-slideshow.cosi.clarkson.edu`)
    kind: Rule
    middlewares:
    - name: https-redirect
      namespace: cosi
    services: # stupid ass bullshit
        - name: noop@internal
          kind: TraefikService

