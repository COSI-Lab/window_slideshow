apiVersion: apps/v1
kind: Deployment
metadata:
  name: window-slideshow #WEEEEE!!!
  namespace: cosi
  labels:
    app: window-slideshow #DO NOT JST PUT "C"!!!
spec:
  replicas: 1
  selector:
    matchLabels:
      app: window-slideshow
  template:
    metadata:
      labels:
        app: window-slideshow
    spec:
      containers:
        - name: window-slideshow
          image: registry.cosi.clarkson.edu/cosi-meta/window-slideshow
          ports:
            - containerPort: 80
          #no need for volumeMounts here check FSU
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      #no need for volume here check FSU
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: window-slideshow-data #Kabab case, USE FOR PART 2!
    namespace: cosi
spec:
    accessModes:
    - ReadWriteMany #INFANET EDITS
    storageClassName: longhorn #burg
    resources:
        requests:
            storage: 2Gi
#No need for a PVC
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: window-slideshow-tls
  namespace: cosi
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`slides.cosi.clarkson.edu`) || Host(`slides.cslabs.clarkson.edu`)
      services:
        - name: window-slideshow
          port: 80
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: window-slideshow-redirect
  namespace: cosi
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`slides.cosi.clarkson.edu`) || Host(`slides.cslabs.clarkson.edu`)
    kind: Rule
    middlewares:
    - name: https-redirect
      namespace: cosi
    services: # stupid ass bullshit
        - name: noop@internal
          kind: TraefikService
